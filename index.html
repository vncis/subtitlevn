<script>/* ===== Hand-drawn style SVG illustrations (all original drawings) ===== */
const C = {ink:'#2b2d42', blue:'#3a86ff', red:'#ef476f', green:'#06d6a0', yellow:'#ffd166', orange:'#f8961e', purple:'#8338ec', teal:'#118ab2', grey:'#adb5bd', light:'#f1f5f9', brown:'#8d5524', pink:'#ff8fab'};
const COLORS = {red:C.red, blue:C.blue, green:C.green, yellow:C.yellow, orange:C.orange, purple:C.purple, brown:C.brown, pink:C.pink, grey:C.grey, black:'#333', white:'#fff'};
function S(w, h, body, maxw){ return `<svg class="pic" viewBox="0 0 ${w} ${h}" style="max-width:${maxw||w}px" xmlns="http://www.w3.org/2000/svg" font-family="Nunito,Arial,sans-serif">${body}</svg>`; }
function T(x, y, s, size, fill, anchor, weight){ return `<text x="${x}" y="${y}" font-size="${size||16}" fill="${fill||C.ink}" text-anchor="${anchor||'middle'}" font-weight="${weight||600}">${s}</text>`; }

/* Number line. opts: {min,max,step,label:every, marks:[{v,t,c}], jumps:[{a,b,t}], w} */
function numberLine(o){
  const w=o.w||620, pad=30, h=o.jumps?110:80, y=h-35;
  const X=v=>pad+(v-o.min)*(w-2*pad)/(o.max-o.min);
  let s=`<line x1="10" y1="${y}" x2="${w-10}" y2="${y}" stroke="${C.ink}" stroke-width="2.5"/>`+
   `<path d="M10 ${y} l10 -6 v12z M${w-10} ${y} l-10 -6 v12z" fill="${C.ink}"/>`;
  const step=o.step||1, lab=o.label||step;
  for(let v=o.min; v<=o.max+1e-9; v+=step){ const big=Math.abs((v-o.min)%lab)<1e-9; s+=`<line x1="${X(v)}" y1="${y-(big?9:5)}" x2="${X(v)}" y2="${y+(big?9:5)}" stroke="${C.ink}" stroke-width="2"/>`; if(big && !(o.hide||[]).includes(v)) s+=T(X(v),y+27,v,14); }
  (o.marks||[]).forEach(m=>{ s+=`<path d="M${X(m.v)} ${y-12} l-7 -14 h14z" fill="${m.c||C.red}"/>`; if(m.t!==undefined) s+=T(X(m.v),y-32,m.t,15,m.c||C.red,'middle',800); });
  (o.jumps||[]).forEach(j=>{ const a=X(j.a), b=X(j.b), m=(a+b)/2; s+=`<path d="M${a} ${y-4} Q${m} ${y-55} ${b} ${y-4}" fill="none" stroke="${C.purple}" stroke-width="2.2"/><path d="M${b} ${y-4} l-9 -5 l2 9z" fill="${C.purple}"/>`; if(j.t) s+=T(m,y-40,j.t,13,C.purple,'middle',800); });
  return S(w,h,s);
}
/* Piece of a 100 square: cells = array of rows; value number, or string label for blank (e.g. 'a'), or null for empty space */
function hundredPiece(rows){
  const cs=46, cols=Math.max(...rows.map(r=>r.length)); let s='';
  rows.forEach((r,i)=>r.forEach((v,j)=>{ if(v===null) return; const x=j*cs+2, y=i*cs+2, blank=typeof v==='string';
    s+=`<rect x="${x}" y="${y}" width="${cs}" height="${cs}" fill="${blank?'#fff7d6':'#fff'}" stroke="${C.ink}" stroke-width="2"/>`+T(x+cs/2,y+cs/2+6,v,blank?17:16,blank?C.orange:C.ink,'middle',blank?800:600); }));
  return S(cols*cs+4, rows.length*cs+4, s, cols*cs*1.1);
}
function hundredSquare(hl, blanks){ // hl: {n:color}, blanks: {n:'a'}
  hl=hl||{}; blanks=blanks||{}; const cs=36; let s='';
  for(let n=1;n<=100;n++){ const i=Math.floor((n-1)/10), j=(n-1)%10, x=j*cs+2, y=i*cs+2;
    s+=`<rect x="${x}" y="${y}" width="${cs}" height="${cs}" fill="${hl[n]||(blanks[n]?'#fff7d6':'#fff')}" stroke="${C.ink}" stroke-width="1.3"/>`+T(x+cs/2,y+cs/2+5,blanks[n]||n,blanks[n]?15:13,blanks[n]?C.orange:C.ink,'middle',blanks[n]?800:600); }
  return S(10*cs+4,10*cs+4,s,380);
}
/* Base ten: tens rods + ones cubes */
function baseTen(t, o){
  const u=12; let s='', x=6;
  for(let i=0;i<t;i++){ for(let k=0;k<10;k++) s+=`<rect x="${x}" y="${6+k*u}" width="${u}" height="${u}" fill="${C.blue}" stroke="#1d4e9e" stroke-width="1"/>`; x+=u+8; }
  x+=6; for(let i=0;i<o;i++){ const col=Math.floor(i/5), row=i%5; s+=`<rect x="${x+col*(u+5)}" y="${6+60+row*(u+0)}" width="${u}" height="${u}" fill="${C.orange}" stroke="#a85d00"/>`; }
  const w=x+(o?Math.ceil(o/5)*(u+5):0)+8; return S(w,132,s,Math.min(w*1.4,560));
}
function tenFrame(n, n2, color2){
  const cs=40; let s='';
  [0,1].forEach(f=>{ const ox=f*(5*cs+20)+4, v=f==0?n:(n2||0); if(f==1 && n2===undefined) return;
    for(let i=0;i<10;i++){ const x=ox+(i%5)*cs, y=4+Math.floor(i/5)*cs; s+=`<rect x="${x}" y="${y}" width="${cs}" height="${cs}" fill="#fff" stroke="${C.ink}" stroke-width="2"/>`; if(i<v) s+=`<circle cx="${x+cs/2}" cy="${y+cs/2}" r="14" fill="${f?(color2||C.blue):C.red}"/>`; } });
  const w = n2===undefined? 5*cs+8 : 10*cs+28; return S(w, 2*cs+8, s);
}
function partWhole(whole, parts){
  const w=300; let s=`<circle cx="150" cy="40" r="32" fill="#fff7d6" stroke="${C.ink}" stroke-width="2.5"/>`+T(150,47,whole,20,C.ink,'middle',800);
  const n=parts.length; parts.forEach((p,i)=>{ const x= n==1?150: 60+i*(180/(n-1)); s+=`<line x1="150" y1="72" x2="${x}" y2="112" stroke="${C.ink}" stroke-width="2"/><circle cx="${x}" cy="140" r="28" fill="#e7f5ff" stroke="${C.ink}" stroke-width="2.5"/>`+T(x,147,p,18,C.ink,'middle',800); });
  return S(w,175,s,280);
}
/* ---- 3D shapes ---- */
function shape3d(n, col){
  col=col||C.blue; let s='';

function jug(max, level, unit, step){ step=step||1; const H=150, u=H/max; let s=`<path d="M30 20 L30 175 Q30 185 40 185 L120 185 Q130 185 130 175 L130 20" fill="#f8fbff" stroke="${C.ink}" stroke-width="3"/>`;

function thermometer(t, min, max){ min=min||0; max=max||40; const H=170, u=H/(max-min); let s=`<rect x="40" y="10" width="26" height="180" rx="13" fill="#fff" stroke="${C.ink}" stroke-width="3"/><circle cx="53" cy="200" r="20" fill="${C.red}" stroke="${C.ink}" stroke-width="3"/><rect x="47" y="${185-(t-min)*u}" width="12" height="${(t-min)*u+10}" fill="${C.red}"/>`;

/* Turning arrow (clockwise / anticlockwise) */
function turnArrow(dir, amount){ // amount: 'quarter','half','full'
  const ang={quarter:90,half:180,full:350}[amount]||90; const r=42, cx=60, cy=60; const sgn=dir=='cw'?1:-1;
  const a0=-90, a1=a0+sgn*ang; const p=(a)=>[cx+r*Math.cos(a*Math.PI/180), cy+r*Math.sin(a*Math.PI/180)];
  const [x0,y0]=p(a0),[x1,y1]=p(a1); const large=ang>180?1:0;

/* Grid map for position & movement: items {r,c,em}, arrow at start facing dir */
function gridMap(rows, cols, items, start){ const cs=48; let s='';

/* Square grid shape (for symmetry/reflection): cells list [r,c], mirror vertical at col m */
function gridShape(rows, cols, cells, mirror, color, ghost){ const cs=30; let s='';

subs:[
{id:'6.1', title:'Money', vi:'Tiền',
 goals:['recognise and use local currency','recognise and use US dollars and cents','use banknotes and coins to make an amount'], goalsVi:['nhận biết và dùng tiền của nước mình','nhận biết và dùng đô-la và xu Mỹ','dùng tiền giấy và tiền xu để tạo một số tiền'],
 words:['coin','banknote','cent','dollar','penny','nickel','dime','quarter','half dollar','value','currency'],
 lesson:()=>`${coins([1,5,10,25,50,100])}<p>Penny = 1c, nickel = 5c, dime = 10c, quarter dollar = 25c, half dollar = 50c. <b>A dollar is worth 100 cents.</b></p>${notes([1,5,10,20])}<p>US banknotes: $1, $2, $5, $10, $20, $50 and $100.</p><p>In Vietnam we use the đồng (VND): notes like 10 000đ, 20 000đ, 50 000đ …</p>`,
 gens:[
  ()=>{ const c=pick([[1,'penny'],[5,'nickel'],[10,'dime'],[25,'quarter dollar'],[50,'half dollar']]); return {q:`How many cents is a <b>${c[1]}</b> worth? [[${c[0]}]] cents`, qVi:`Đồng ${c[1]} có giá trị bao nhiêu xu (cent)?`, pic:coins([c[0]]), skill:'Giá trị đồng xu', exp:`A ${c[1]} is worth ${c[0]}c.`, expVi:`Đồng ${c[1]} trị giá ${c[0]} xu.`}; },
  ()=>({q:'A dollar is worth [[100]] cents.', qVi:'1 đô-la bằng bao nhiêu xu?', pic:coins([100]), skill:'Giá trị đồng xu', exp:'1 dollar = 100 cents.', expVi:'1 đô-la = 100 xu.'}),
  ()=>{ const r=pick([[[1,1,1,1,1],5],[[5,5],10],[[10,10,5],25],[[25,25],50],[[10,10,10,10,10],50],[[50,50],100],[[5,5,5,5,5],25]]); return {q:'Which single coin is worth the same as this row of coins?', qVi:'Một đồng xu nào có giá trị bằng cả hàng xu này?', type:'mc', opts:[r[1],...[5,10,25,50,100].filter(x=>x!=r[1]).slice(0,3)].map(v=>({h:coins([v]),v:String(v)})), pics:true, pic:coins(r[0]), skill:'Đổi tiền', exp:`${r[0].map(v=>v+'c').join(' + ')} = ${r[1]}c, the same as one ${COINNAME[r[1]]}.`, expVi:`${r[0].map(v=>v+'c').join(' + ')} = ${r[1]} xu.`}; },
  ()=>{ const set=sample([25,10,10,5,5,1,1,1,50],R(3,5)).sort((a,b)=>b-a); const t=set.reduce((a,b)=>a+b); return {q:`How much money is this altogether? [[${t}]] cents`, qVi:'Tất cả có bao nhiêu xu?', pic:coins(set), skill:'Tính tổng tiền', exp:`Start with the biggest coin and count on: ${set.join(' + ')} = ${t}c.`, expVi:`Bắt đầu từ đồng lớn nhất rồi đếm thêm: ${set.join(' + ')} = ${t} xu.`}; },
  ()=>{ const good=pick([[25,25],[10,10,10,10,10],[25,10,10,5],[25,10,5,5,5]]); const bad=[[25,10,10],[10,10,10,10],[25,25,5]]; return {q:'Marcus spent 50c on some candy. He did not have a half dollar coin. Which coins could he pay with?', qVi:'Marcus tiêu 50 xu mua kẹo. Bạn ấy không có đồng 50 xu. Bạn ấy có thể trả bằng nhóm xu nào?', type:'mc', opts:[good,...bad].map(x=>({h:coins(x),v:x.join('+')})), pics:true, wide:true, skill:'Đổi tiền', exp:`${good.join('c + ')}c = 50c. The other groups make 45c, 40c and 55c.`, expVi:`${good.join(' + ')} = 50 xu.`}; },
  ()=>{ const p=pick([[25,[20,5]],[15,[10,5]],[30,[20,10]],[12,[10,2]],[60,[50,10]],[35,[20,10,5]]]); const wrong=[[20,10],[10,2,1],[50],[5,5,2],[20,20]].filter(x=>x.reduce((a,b)=>a+b)!=p[0]).slice(0,3); return {q:`Zara spent US$${p[0]} on a T-shirt. Which banknotes could she pay with?`, qVi:`Zara tiêu ${p[0]} đô-la mua áo phông. Bạn ấy có thể trả bằng những tờ tiền nào?`, type:'mc', opts:[p[1],...wrong].map(x=>({h:notes(x),v:x.join('+')})), pics:true, wide:true, skill:'Đổi tiền', exp:`${p[1].map(v=>'$'+v).join(' + ')} = $${p[0]}.`, expVi:`${p[1].map(v=>v+' đô').join(' + ')} = ${p[0]} đô-la.`}; },
  ()=>{ const d=pick([[10,2],[5,2,1],[20,5],[10,5,2],[20,10,1]]), c=pick([[25,25],[50,10],[25,10,5],[10,5]]); const D=d.reduce((a,b)=>a+b), Cc=c.reduce((a,b)=>a+b); return {q:`How much money? $[[${D}]] and [[${Cc}]]c`, qVi:'Có tất cả bao nhiêu tiền? (đô-la và xu)', pic:notes(d)+coins(c), skill:'Tính tổng tiền', exp:`Notes: ${d.map(v=>'$'+v).join(' + ')} = $${D}. Coins: ${c.join('c + ')}c = ${Cc}c. Total $${D} and ${Cc}c.`, expVi:`Tiền giấy: ${D} đô. Tiền xu: ${Cc} xu.`}; },
  ()=>{ const a=pick([50,20,10,5]), b=pick([20,10,5,2,1].filter(x=>x<a)); return {q:`You have a $${a} banknote and a $${b} banknote. How much do you have? $[[${a+b}]]`, qVi:`Con có 1 tờ ${a} đô-la và 1 tờ ${b} đô-la. Con có bao nhiêu tiền?`, pic:notes([a,b]), skill:'Tính tổng tiền', exp:`$${a} + $${b} = $${a+b}.`, expVi:`${a} + ${b} = ${a+b} đô-la.`}; },
  ()=>({q:'Which of these is <b>not</b> a US banknote?', qVi:'Tờ tiền nào KHÔNG phải là tiền giấy của Mỹ?', type:'mc', opts:['$3','$2','$20','$50'], skill:'Giá trị đồng xu', exp:'US banknotes are $1, $2, $5, $10, $20, $50 and $100. There is no $3 note.', expVi:'Tiền giấy Mỹ có $1, $2, $5, $10, $20, $50, $100. Không có tờ $3.'}),
  ()=>({q:'Which group of coins does <b>not</b> make 20c?', qVi:'Nhóm xu nào KHÔNG bằng 20 xu?', type:'mc', opts:[[10,5,1,1,1],[10,10],[10,5,5],[5,5,5,5]].map(x=>({h:coins(x),v:x.join('+')})), pics:true, wide:true, skill:'Đổi tiền', exp:'10 + 5 + 1 + 1 + 1 = 18c, not 20c. The others all make 20c.', expVi:'10 + 5 + 1 + 1 + 1 = 18 xu, không phải 20 xu.'}),
 ]}],
check:[
  ()=>{ const d=R(1,3)*10+R(1,4), c=pick([45,35,60,85]); return {q:`I spent $${d} and ${c}c in the supermarket. Which notes and coins could I pay with?`, qVi:`Mẹ tiêu ${d} đô-la ${c} xu ở siêu thị. Có thể trả bằng những tờ tiền và đồng xu nào?`, type:'mc', opts:[[d,c],[d-1,c],[d,c-10],[d+1,c+5]].map(([x,y])=>{ const n=[]; let r=x; [20,10,5,2,1].forEach(v=>{ while(r>=v){n.push(v); r-=v;} }); const cs=[]; let rc=y; [50,25,10,5,1].forEach(v=>{ while(rc>=v){cs.push(v); rc-=v;} }); return {h:notes(n)+coins(cs),v:x+'.'+y}; }), pics:true, wide:true, skill:'Đổi tiền', exp:`Make $${d} with notes and ${c}c with coins.`, expVi:`Tạo ${d} đô bằng tiền giấy và ${c} xu bằng tiền xu.`}; },
  ()=>{ const set=sample([25,25,10,5,1,50,10],4); const t=set.reduce((a,b)=>a+b); return {q:`Find the total: [[${t}]]c`, qVi:'Tìm tổng số tiền.', pic:coins(set.sort((a,b)=>b-a)), skill:'Tính tổng tiền', exp:`${set.join(' + ')} = ${t}c.`, expVi:`${set.join(' + ')} = ${t} xu.`}; },
  ()=>({q:'How many dimes make 1 dollar? [[10]]', qVi:'Bao nhiêu đồng 10 xu (dime) thì bằng 1 đô-la?', pic:coins([10]), skill:'Đổi tiền', exp:'10 × 10c = 100c = $1.', expVi:'10 × 10 xu = 100 xu = 1 đô-la.'}),
]});

/* ================= UNIT 7: Time ================= */
unit({n:7, title:'Time', vi:'Thời gian', icon:'📅', color:'#e76f51', strand:'Geometry and measure',
intro:'We use different units to measure time. A second is the shortest unit and a year is the longest. A calendar shows us the days and months of a year.',
introVi:'Chúng ta dùng nhiều đơn vị để đo thời gian. Giây là đơn vị ngắn nhất, năm là dài nhất. Lịch cho biết ngày và tháng trong năm.',
subs:[
{id:'7.1', title:'Units of time and the calendar', vi:'Đơn vị thời gian và lịch',
 goals:['order and compare units of time','record dates in numbers and words','read the date from a calendar'], goalsVi:['sắp xếp và so sánh các đơn vị thời gian','ghi ngày tháng bằng số và bằng chữ','đọc ngày trên lịch'],
 words:['second','minute','hour','day','week','month','year','calendar','date','leap year','yesterday','tomorrow'],
 lesson:()=>`<p><b>second → minute → hour → day → week → month → year</b></p>${table(['','is the same as'],[['1 minute','60 seconds'],['1 hour','60 minutes'],['1 day','24 hours'],['1 week','7 days'],['1 month','about 4 weeks'],['1 year','12 months']])}${calendar('October 2022',5,31,[3,21])}<p>Monday 3rd October 2022 = 03/10/22.</p>`,
 gens:[
  ()=>{ const all=['second','minute','hour','day','week','month','year']; const s=R(0,2); const items=all.slice(s,s+5); return {q:'Put these units of time in order from the <b>shortest</b> to the <b>longest</b>.', qVi:'Sắp xếp các đơn vị thời gian từ NGẮN nhất đến DÀI nhất.', type:'order', items, skill:'Đơn vị thời gian', exp:'second < minute < hour < day < week < month < year.', expVi:'giây < phút < giờ < ngày < tuần < tháng < năm.'}; },
  ()=>{ const p=pick([['1 year','12','months','1 năm = 12 tháng'],['1 week','7','days','1 tuần = 7 ngày'],['1 hour','60','minutes','1 giờ = 60 phút'],['1 minute','60','seconds','1 phút = 60 giây'],['1 day','24','hours','1 ngày = 24 giờ']]); return {q:`${p[0]} = [[${p[1]}]] ${p[2]}`, qVi:'Điền số thích hợp.', skill:'Đơn vị thời gian', exp:p[0]+' is the same as '+p[1]+' '+p[2]+'.', expVi:p[3]+'.'}; },
  ()=>{ const p=pick([['blinking your eye 👁️','about a second'],['clapping your hands once 👏','about a second'],['brushing your teeth 🪥','a few minutes'],['eating a sandwich 🥪','a few minutes'],['sleeping at night 😴','hours'],['a school holiday 🏖️','weeks']]); return {q:`How long does ${p[0]} take?`, qVi:'Việc này mất khoảng bao lâu?', type:'mc', opts:['about a second','a few minutes','hours','weeks'], keep:true, ansText:p[1], skill:'Ước lượng thời gian', exp:`${p[0]} takes ${p[1]}.`, expVi:'Hãy hình dung thời gian làm việc đó trong thực tế.'}; },
  ()=>{ const i=R(0,6), w=pick(['after','before']); const a=w=='after'?(i+1)%7:(i+6)%7; return {q:`What is the day ${w} ${DAYS[i]}?`, qVi:`Ngày ${w=='after'?'sau':'trước'} ${DAYS_VI[i]} là ngày nào?`, type:'mc', opts:[DAYS[a],...sample(DAYS.filter(d=>d!=DAYS[a]),3)], skill:'Ngày trong tuần', exp:`Monday, Tuesday, Wednesday, Thursday, Friday, Saturday, Sunday. The day ${w} ${DAYS[i]} is ${DAYS[a]}.`, expVi:`Ngày ${w=='after'?'sau':'trước'} ${DAYS_VI[i]} là ${DAYS_VI[a]}.`}; },
  ()=>{ const i=R(0,11), w=pick(['after','before']); const a=w=='after'?(i+1)%12:(i+11)%12; return {q:`Which month comes ${w} ${MONTHS[i]}?`, qVi:`Tháng nào đứng ${w=='after'?'sau':'trước'} tháng ${i+1}?`, type:'mc', opts:[MONTHS[a],...sample(MONTHS.filter(m=>m!=MONTHS[a]),3)], skill:'Tháng trong năm', exp:`${MONTHS[(i+11)%12]}, ${MONTHS[i]}, ${MONTHS[(i+1)%12]}.`, expVi:`${MONTHS[i]} là tháng ${i+1}. Tháng ${w=='after'?'sau':'trước'} là ${MONTHS[a]} (tháng ${a+1}).`}; },
  ()=>{ const items=sample([0,1,2,3,4,5,6],4).sort((a,b)=>a-b).map(i=>DAYS[i]); return {q:'Put these days of the week in order, starting from Monday.', qVi:'Sắp xếp các ngày trong tuần theo thứ tự (bắt đầu từ thứ Hai).', type:'order', items, skill:'Ngày trong tuần', exp:DAYS.join(', ')+'.', expVi:'Thứ Hai, thứ Ba, thứ Tư, thứ Năm, thứ Sáu, thứ Bảy, Chủ nhật.'}; },
  ()=>{ const d=R(1,28), m=R(0,11), y=R(19,24); const s=`${String(d).padStart(2,'0')}/${String(m+1).padStart(2,'0')}/${y}`; return {q:`Write this date in numbers: <b>${ordSuffix(d)} ${MONTHS[m]} 20${y}</b>`, qVi:'Viết ngày tháng này bằng số (ngày/tháng/năm).', type:'mc', opts:[s,`${String(m+1).padStart(2,'0')}/${String(d).padStart(2,'0')}/${y}`,`${String(d).padStart(2,'0')}/${String((m+1)%12+1).padStart(2,'0')}/${y}`,`${String(d).padStart(2,'0')}/${String(m+1).padStart(2,'0')}/${y+1}`], skill:'Ghi ngày tháng', exp:`Day / month / year: ${d} / ${m+1} (${MONTHS[m]} is month ${m+1}) / ${y}.`, expVi:`Ngày / tháng / năm: ${d} / ${m+1} / ${y}.`}; },
  ()=>{ const d=pick([3,4,7,11,14,17,21,25,28]); const dow=(5+d-1)%7; return {q:`Look at the calendar for October 2022. What day of the week is the ringed date?`, qVi:'Nhìn lịch tháng 10/2022. Ngày được khoanh tròn là thứ mấy?', type:'mc', opts:[DAYS[dow],...sample(DAYS.filter(x=>x!=DAYS[dow]),3)], pic:calendar('October 2022',5,31,[d]), skill:'Đọc lịch', exp:`${d} is in the ${['M','T','W','T','F','S','S'][dow]} column: ${DAYS[dow]} ${ordSuffix(d)} October 2022.`, expVi:`Ngày ${d} nằm ở cột ${DAYS_VI[dow]}.`}; },
  ()=>{ const dw=R(0,6); const dates=[1,2,3,4,5].map(k=>{ const d=1+((dw-5+7)%7)+7*(k-1); return d; }).filter(d=>d<=31); const nth=R(1,3); const ans=dates[nth-1]; return {q:`In October 2022, what is the date of the ${ORD[nth]} ${DAYS[dw]}? [[${ans}]]`, qVi:`Trong tháng 10/2022, ${DAYS_VI[dw]} thứ ${nth} của tháng là ngày bao nhiêu?`, pic:calendar('October 2022',5,31,[]), skill:'Đọc lịch', exp:`Look down the ${DAYS[dw]} column: ${dates.join(', ')}. The ${ORD[nth]} is ${ans}.`, expVi:`Nhìn xuống cột ${DAYS_VI[dw]}: ${dates.join(', ')}.`}; },
  ()=>{ const m=pick([[3,30],[5,30],[8,30],[10,30],[0,31],[6,31],[11,31]]); return {q:`How many days are there in ${MONTHS[m[0]]}?`, qVi:`Tháng ${m[0]+1} có bao nhiêu ngày?`, type:'mc', opts:['30','31','28'], keep:true, ansText:String(m[1]), skill:'Tháng trong năm', exp:'30 days: April, June, September, November. February has 28 (29 in a leap year). All the others have 31.', expVi:'Tháng 4, 6, 9, 11 có 30 ngày. Tháng 2 có 28 ngày (29 ngày năm nhuận). Các tháng còn lại 31 ngày.'}; },
  ()=>({q:'February has [[28]] days, or [[29]] days in a leap year.', qVi:'Tháng 2 có bao nhiêu ngày? Năm nhuận có bao nhiêu ngày?', skill:'Tháng trong năm', exp:'February is the only month with 28 days, 29 in a leap year.', expVi:'Tháng 2 có 28 ngày, năm nhuận có 29 ngày.'}),
 ]}],
check:[
  ()=>({q:'Here are some units of time: day, week, hour, month. The <b>shortest</b> unit is …', qVi:'Đơn vị thời gian nào NGẮN nhất?', type:'mc', opts:['hour','day','week','month'], skill:'Đơn vị thời gian', exp:'hour < day < week < month.', expVi:'giờ < ngày < tuần < tháng.'}),
  ()=>({q:'Use the October 2022 calendar. What day of the week is 01/11/22?', qVi:'Dùng lịch tháng 10/2022. Ngày 01/11/22 là thứ mấy?', type:'mc', opts:['Tuesday','Monday','Wednesday','Sunday'], pic:calendar('October 2022',5,31,[31]), skill:'Đọc lịch', exp:'31st October is a Monday, so the next day, 1st November, is a Tuesday.', expVi:'Ngày 31/10 là thứ Hai nên ngày hôm sau 1/11 là thứ Ba.'}),
  ()=>({q:'What day of the week is 30/09/22?', qVi:'Ngày 30/09/22 là thứ mấy?', type:'mc', opts:['Friday','Saturday','Thursday','Sunday'], pic:calendar('October 2022',5,31,[1]), skill:'Đọc lịch', exp:'1st October 2022 is a Saturday, so the day before (30th September) is a Friday.', expVi:'1/10/2022 là thứ Bảy nên ngày hôm trước (30/9) là thứ Sáu.'}),
  ()=>({q:'<b>Project: Time a task.</b> Which task would take about <b>1 minute</b>?', qVi:'Dự án "Bấm giờ": Việc nào mất khoảng 1 phút?', type:'mc', opts:['counting slowly to 60','blinking once','sleeping all night','a school holiday'], pic:`<div class="emo huge">⏱️</div>`, skill:'Ước lượng thời gian', exp:'1 minute = 60 seconds, so counting slowly to 60 takes about a minute.', expVi:'1 phút = 60 giây, đếm chậm đến 60 mất khoảng 1 phút.'}),
]});

/* ================= UNIT 8: Numbers to 100 (2) ================= */
unit({n:8, title:'Numbers to 100 (2)', vi:'Các số đến 100 (phần 2)', icon:'🔢', color:'#4361ee', strand:'Number',
intro:'In this unit you will use place value in new ways. You will split numbers in different ways and find fractions of numbers.',
introVi:'Unit này dùng giá trị theo hàng theo cách mới: viết số bằng chữ, làm tròn, tách số theo nhiều cách và tìm phân số của một số.',
subs:[
{id:'8.1', title:'Numbers in words, rounding and regrouping', vi:'Viết số bằng chữ, làm tròn và tách số',
 goals:['write 2-digit numbers in words','round 2-digit numbers to the nearest 10','regroup 2-digit numbers in different ways'], goalsVi:['viết số có 2 chữ số bằng chữ','làm tròn số đến hàng chục gần nhất','tách (regroup) số theo nhiều cách'],
 words:['round','nearest','regroup','twenty','thirty','forty','fifty','sixty','seventy','eighty','ninety'],
 lesson:()=>`${numberLine({min:70,max:80,step:1,label:10,marks:[{v:74,t:'74'}]})}<p><b>Round 74 to the nearest 10:</b> 74 is closer to 70 than 80, so 74 rounds to 70. Numbers ending in 5 round <b>up</b> (35 → 40).</p><p><b>Regroup 31:</b> 30 + 1, 20 + 11, 10 + 21, 0 + 31.</p><p>42 = forty-two &nbsp; 76 = seventy-six</p>`,
 gens:[
  ()=>{ const n=R(21,99); return {q:`Write the number in words: <b>${n}</b>`, qVi:'Viết số này bằng chữ tiếng Anh.', type:'mc', opts:[words(n), words(Math.floor(n/10)+(n%10)*10>=20?((n%10)*10+Math.floor(n/10)):n+10), words(n<90?n+10:n-10), words(n%10?n-1:n+1)], skill:'Đọc, viết số bằng chữ', exp:`${n} = ${Math.floor(n/10)} tens and ${n%10} ones → ${words(n)}.`, expVi:`${n} đọc là "${words(n)}".`}; },
  ()=>{ const n=R(21,99); return {q:`Read the number word and write the number: <b>${words(n)}</b> = [[${n}]]`, qVi:'Đọc chữ số tiếng Anh và viết thành số.', skill:'Đọc, viết số bằng chữ', exp:`${words(n)} = ${n}.`, expVi:`"${words(n)}" là số ${n}.`}; },
  ()=>{ const n=R(21,99); return {q:`Write <b>${n}</b> in words. [[${words(n)}|${words(n).replace('-',' ')}]]`, qVi:'Gõ số này bằng chữ tiếng Anh (ví dụ: forty-two).', pic:baseTen(Math.floor(n/10),n%10), skill:'Đọc, viết số bằng chữ', exp:`${n} = ${words(n)}. Use a hyphen (-) between the tens and the ones word.`, expVi:`${n} viết là "${words(n)}". Có dấu gạch nối giữa hàng chục và hàng đơn vị.`, text:true}; },
  ()=>{ const n=R(11,98); const r=Math.round(n/10)*10 + (n%10==5?0:0); const ans=n%10>=5?Math.ceil(n/10)*10:Math.floor(n/10)*10; return {q:`Round ${n} to the nearest 10. [[${ans}]]`, qVi:`Làm tròn ${n} đến hàng chục gần nhất.`, pic:numberLine({min:Math.floor(n/10)*10,max:Math.floor(n/10)*10+10,step:1,label:5,marks:[{v:n,t:n}]}), skill:'Làm tròn', exp:n%10==5?`${n} is exactly in the middle. We round up to ${ans}.`:`${n} is closer to ${ans} than to ${ans==Math.floor(n/10)*10?ans+10:ans-10}.`, expVi:n%10==5?`${n} ở chính giữa, ta làm tròn lên ${ans}.`:`${n} gần ${ans} hơn.`}; },

{id:'8.2', title:'Fractions of numbers', vi:'Phân số của một số',

  ()=>{ const n=R(1,10)*2; return {q:`${fracLabel(1,2)} of ${n} = [[${n/2}]]`, qVi:`Một nửa của ${n} là bao nhiêu?`, pic:emojis('🍓',n,10), skill:'Một nửa của số', exp:`Half of ${n} = ${n} ÷ 2 = ${n/2}.`, expVi:`Một nửa của ${n} = ${n} : 2 = ${n/2}.`}; },
  ()=>{ const n=pick([4,8,12,16,20]); return {q:`${fracLabel(1,4)} of ${n} = [[${n/4}]]`, qVi:`Một phần tư của ${n} là bao nhiêu?`, pic:groups(4,n/4,'🍪'), skill:'Một phần tư của số', exp:`A quarter of ${n} = ${n} ÷ 4 = ${n/4}. Share into 4 equal groups.`, expVi:`Một phần tư của ${n} = ${n} : 4 = ${n/4}.`}; },
  ()=>{ const n=pick([4,8,12,16,20]); return {q:`${fracLabel(3,4)} of ${n} = [[${3*n/4}]]`, qVi:`Ba phần tư của ${n} là bao nhiêu?`, pic:groups(4,n/4,'🍬'), skill:'Một phần tư của số', exp:`A quarter of ${n} is ${n/4}. Three-quarters is 3 groups: ${n/4} + ${n/4} + ${n/4} = ${3*n/4}.`, expVi:`Một phần tư của ${n} là ${n/4}. Ba phần tư là 3 nhóm: ${3*n/4}.`}; },
  ()=>{ const n=R(2,10); return {q:`Half of a number is ${n}. What is the number? [[${2*n}]]`, qVi:`Một nửa của một số là ${n}. Số đó là bao nhiêu?`, skill:'Một nửa của số', exp:`If half is ${n}, the other half is also ${n}. ${n} + ${n} = ${2*n}.`, expVi:`Nửa kia cũng là ${n}. ${n} + ${n} = ${2*n}.`}; },
  ()=>{ const n=R(1,5); return {q:`A quarter of a number is ${n}. What is the number? [[${4*n}]]`, qVi:`Một phần tư của một số là ${n}. Số đó là bao nhiêu?`, skill:'Một phần tư của số', exp:`4 quarters make the whole: ${n} + ${n} + ${n} + ${n} = ${4*n}.`, expVi:`4 phần tư tạo thành số nguyên: 4 × ${n} = ${4*n}.`}; },
  ()=>{ const n=pick([8,12,16,20]); return {q:`Marcus and his 3 brothers shared a bag of ${n} apples equally. How many apples did they each get? [[${n/4}]]`, qVi:`Marcus và 3 anh em chia đều túi ${n} quả táo. Mỗi bạn được mấy quả?`, pic:emojis('🍎',n,10), skill:'Một phần tư của số', exp:`Marcus + 3 brothers = 4 children. ${n} ÷ 4 = ${n/4}. Each gets a quarter.`, expVi:`Marcus và 3 anh em là 4 người. ${n} : 4 = ${n/4}.`}; },

  ()=>{ const p=pick([[[1,4],[1,4],'1/2','one half'],[[1,2],[1,4],'3/4','three-quarters'],[[1,4],[1,4],'2/4','two quarters'],[[1,2],[1,2],'1','one whole']]); const lab=f=>f=='1'?'1':fracLabel(...f.split('/')); const opts=[p[2],...['1/2','3/4','1','2/8','1/4'].filter(x=>x!=p[2]&&!(p[2]=='2/4'&&x=='1/2')&&!(p[2]=='1/2'&&x=='2/4'))].slice(0,4);

 ]}],

  ()=>{ const r=R(2,5), m=R(2,5), b=R(1,4); const shapes=[]; for(let i=0;i<r;i++) shapes.push('Red only'); return {q:`Look at the Venn diagram. How many shapes are red? [[${r+b}]]`, qVi:'Có bao nhiêu hình màu đỏ?', pic:venn('Red','More than 4 sides',Array(r).fill('🔺'),Array(b).fill('⬟'),Array(m).fill('🟦⬢'.slice(0,2)),[]), skill:'Sơ đồ Venn', exp:`Count everything inside the Red circle, including the middle: ${r} + ${b} = ${r+b}.`, expVi:`Đếm tất cả trong vòng tròn "Red", kể cả phần giữa: ${r} + ${b} = ${r+b}.`}; },

unit({n:10, title:'Calculating', vi:'Tính toán', icon:'🧮', color:'#d62828', strand:'Number',
intro:'We add, subtract, multiply and divide to solve all sorts of everyday problems.',
introVi:'Chúng ta cộng, trừ, nhân, chia để giải quyết đủ loại vấn đề hằng ngày.',
subs:[
{id:'10.1', title:'Adding and subtracting two 2-digit numbers', vi:'Cộng, trừ hai số có 2 chữ số',
 goals:['add two 2-digit numbers','subtract a 2-digit number from another 2-digit number','find the difference between two 2-digit numbers'], goalsVi:['cộng hai số có 2 chữ số','trừ hai số có 2 chữ số','tìm hiệu giữa hai số có 2 chữ số'],

  ()=>{ const x=R(4,9)*10+R(4,9), y=R(1,Math.floor(x/10)-1)*10+R(0,x%10); return {q:`<div class="vsum"><span>${x}</span><span>− ${y}</span></div> [[${x-y}]]`, qVi:'Tính hiệu (không nhớ).', skill:'Trừ 2 số có 2 chữ số', exp:`Ones: ${x%10} − ${y%10} = ${x%10-y%10}. Tens: ${Math.floor(x/10)} − ${Math.floor(y/10)} = ${Math.floor(x/10)-Math.floor(y/10)}. Answer ${x-y}.`, expVi:'Trừ hàng đơn vị trước rồi trừ hàng chục.'}; },
  ()=>{ const x=R(5,9)*10+R(3,9), y=R(1,4)*10+R(0,x%10); return {q:`Solve: ${x} − ${y} = [[${x-y}]]`, qVi:'Giải phép trừ (gợi ý: tách thành chục và đơn vị).', skill:'Trừ 2 số có 2 chữ số', exp:`${Math.floor(x/10)*10} − ${Math.floor(y/10)*10} = ${(Math.floor(x/10)-Math.floor(y/10))*10} and ${x%10} − ${y%10} = ${x%10-y%10}. ${x-y}.`, expVi:'Tách mỗi số thành chục và đơn vị rồi trừ từng phần.'}; },
  ()=>{ const a=R(30,70), d=R(11,28); const b=a+d; return {q:`Find the difference between ${a} and ${b}. [[${d}]]`, qVi:`Tìm hiệu giữa ${a} và ${b}.`, pic:numberLine({min:Math.floor(a/10)*10,max:Math.ceil(b/10)*10,step:1,label:10,marks:[{v:a,t:a,c:C.blue},{v:b,t:b}]}), skill:'Tìm hiệu', exp:`Count on from ${a} to ${b}, or subtract: ${b} − ${a} = ${d}.`, expVi:`Đếm thêm từ ${a} đến ${b} hoặc tính ${b} − ${a} = ${d}.`}; },
  ()=>({q:'The difference between two numbers is 14. One of the numbers is 45. What could the other number be? Choose all.', qVi:'Hiệu của hai số là 14. Một số là 45. Số kia có thể là bao nhiêu? Chọn tất cả.', type:'multi', opts:['59','31','41','61'], ans:[0,1], skill:'Tìm hiệu', exp:'45 + 14 = 59 and 45 − 14 = 31. Both have a difference of 14 from 45!', expVi:'45 + 14 = 59 và 45 − 14 = 31. Cả hai đều đúng!'}),
  ()=>{ const items=shuffle([['24 + 35 = 22 + 36',false],['45 + 54 = 44 + 55',true],['67 − 23 = 68 − 25',false],['56 − 35 = 58 − 37',true]]); return {q:'Sofia made some mistakes. Which number facts are correct? Choose all.', qVi:'Sofia viết sai vài đẳng thức. Chọn tất cả các đẳng thức ĐÚNG.', type:'multi', opts:items.map(x=>x[0]), ans:items.map((x,i)=>x[1]?i:-1).filter(i=>i>=0), skill:'Hai vế bằng nhau', exp:'24 + 35 = 59 but 22 + 36 = 58 ✗. 45 + 54 = 99 = 44 + 55 ✓. 67 − 23 = 44 but 68 − 25 = 43 ✗. 56 − 35 = 21 = 58 − 37 ✓.', expVi:'Tính kết quả hai vế rồi so sánh.'}; },
  ()=>{ const a=R(1,4), b=R(a+1,8); const x=a*10+b; return {q:`Swap the digits of ${x} and add: ${x} + ${b*10+a} = [[${x+b*10+a}]]`, qVi:'Đổi chỗ hai chữ số rồi cộng hai số.', skill:'Cộng 2 số có 2 chữ số', exp:`${x} + ${b*10+a} = ${x+b*10+a}. The answer always has two digits the same (a multiple of 11)!`, expVi:`Kết quả luôn có hai chữ số giống nhau (chia hết cho 11)!`}; },
  ()=>{ const x=R(2,5)*10+R(1,4), y=R(2,4)*10+R(1,5); return {q:`Use the 100 square: ${x} + ${y} = [[${x+y}]]`, qVi:'Dùng bảng 100 ô: đếm thêm chục rồi đơn vị.', pic:hundredSquare({[x]:'#bde0fe',[x+y]:'#ffd166'}), skill:'Cộng 2 số có 2 chữ số', exp:`From ${x}, go down ${Math.floor(y/10)} rows (+${Math.floor(y/10)*10}) then right ${y%10} (+${y%10}): ${x+y}.`, expVi:`Từ ${x} đi xuống ${Math.floor(y/10)} hàng rồi sang phải ${y%10} ô.`}; },
 ]},
{id:'10.2', title:'Connecting addition and subtraction', vi:'Liên hệ giữa phép cộng và phép trừ',
 goals:['use the connection between addition and subtraction to find the inverse calculation','find the fact family for a set of 3 numbers','use rounding to estimate and the inverse to check'], goalsVi:['dùng phép tính ngược (inverse) để kiểm tra','tìm "gia đình phép tính" của 3 số','làm tròn để ước lượng và dùng phép tính ngược để kiểm tra'],
 words:['inverse','fact family','estimate','check','round'],
 lesson:()=>`${partWhole(47,[21,26])}<p><b>Fact family</b> for 21, 26, 47:<br>21 + 26 = 47 &nbsp; 26 + 21 = 47<br>47 − 21 = 26 &nbsp; 47 − 26 = 21</p><p>Addition and subtraction are <b>inverse</b> calculations: one undoes the other.</p><p><b>Estimate</b> 42 + 37 → 40 + 40 = 80. Answer 79 is close!</p>`,
 gens:[
  ()=>{ const a=R(11,40), b=R(5,30); const sub=Math.random()<.5; return sub?{q:`Find the inverse calculation: ${a+b} − ${b} = ${a} → ${a} + [[${b}]] = [[${a+b}]]`, qVi:'Viết phép tính ngược (phép cộng) của phép trừ này.', skill:'Phép tính ngược', exp:`Subtraction is undone by addition: ${a} + ${b} = ${a+b}.`, expVi:`Phép trừ được kiểm tra bằng phép cộng: ${a} + ${b} = ${a+b}.`, anyOrder:[]}:{q:`Find the inverse calculation: ${a} + ${b} = ${a+b} → ${a+b} − ${b} = [[${a}]]`, qVi:'Viết phép tính ngược (phép trừ) của phép cộng này.', skill:'Phép tính ngược', exp:`Addition is undone by subtraction: ${a+b} − ${b} = ${a}.`, expVi:`Phép cộng được kiểm tra bằng phép trừ: ${a+b} − ${b} = ${a}.`}; },
  ()=>{ const a=R(11,35), b=R(12,40), c=a+b; return {q:`The numbers ${a}, ${b} and ${c} make a fact family. Which calculation is <b>not</b> in the fact family?`, qVi:`Ba số ${a}, ${b}, ${c} tạo thành gia đình phép tính. Phép tính nào KHÔNG thuộc gia đình này?`, type:'mc', opts:[`${a} − ${b} = ${c}`,`${b} + ${a} = ${c}`,`${c} − ${a} = ${b}`,`${c} − ${b} = ${a}`], pic:partWhole(c,[a,b]), skill:'Gia đình phép tính', exp:`The whole (${c}) is the biggest. You cannot take ${b} from ${a} and get ${c}.`, expVi:`Số lớn nhất ${c} là "tổng". ${a} − ${b} không thể bằng ${c}.`}; },
  ()=>{ const a=R(1,9); return {q:`${a} + ${10-a} = 10. Write the inverse: 10 − ${10-a} = [[${a}]]`, qVi:'Viết phép tính ngược của cặp số cộng bằng 10.', skill:'Phép tính ngược', exp:`10 − ${10-a} = ${a}.`, expVi:`10 − ${10-a} = ${a}.`}; },
  ()=>{ const x=R(5,9)*10+R(5,9), y=R(1,4)*10+R(1,4); const r=x-y; return {q:`Find the missing digit: ${x} − ${Math.floor(y/10)}☐ = ${r}. The missing digit is [[${y%10}]]`, qVi:'Tìm chữ số bị thiếu (gợi ý: dùng phép tính ngược).', skill:'Phép tính ngược', exp:`Use the inverse: ${x} − ${r} = ${y}. The missing digit is ${y%10}.`, expVi:`Dùng phép tính ngược: ${x} − ${r} = ${y}.`}; },
  ()=>{ const a=R(2,6)*10, b=R(1,3)*10; return {q:`${a} + ${b} = ${a+b}. Complete the subtraction: ${a+b} − ${a} = [[${b}]] and ${a+b} − ${b} = [[${a}]]`, qVi:'Viết các phép trừ dùng cùng ba số.', skill:'Gia đình phép tính', exp:`${a+b} − ${a} = ${b}; ${a+b} − ${b} = ${a}.`, expVi:`${a+b} − ${a} = ${b}; ${a+b} − ${b} = ${a}.`}; },
  ()=>{ const x=R(21,59), y=R(21,39); const op=pick(['+','−']); const X=Math.round(x/10)*10, Y=Math.round(y/10)*10; const big=op=='−'?Math.max(x,y)+20:x; const est=op=='+'?X+Y:Math.round(big/10)*10-Y; return {q:`Estimate by rounding each number to the nearest 10: ${op=='+'?x:big} ${op} ${y} ≈ [[${est}]]`, qVi:'Ước lượng bằng cách làm tròn mỗi số đến hàng chục.', skill:'Ước lượng', exp:`${op=='+'?x:big} rounds to ${op=='+'?X:Math.round(big/10)*10}, ${y} rounds to ${Y}. ${op=='+'?X:Math.round(big/10)*10} ${op} ${Y} = ${est}.`, expVi:'Làm tròn từng số rồi tính.'}; },
 ]},

const DIRS=['up','right','down','left']; const DIRVI={up:'lên trên',right:'sang phải',down:'xuống dưới',left:'sang trái'};
function turnDir(d, amt, cw){ const k={quarter:1,half:2,full:4}[amt]*(cw?1:-1); return DIRS[(DIRS.indexOf(d)+k+8)%4]; }
function arrowPic(dir, col){ const rot={up:0,right:90,down:180,left:270}[dir]; return S(100,100,`<g transform="rotate(${rot} 50 50)"><polygon points="50,8 80,45 60,45 60,92 40,92 40,45 20,45" fill="${col||C.blue}" stroke="${C.ink}" stroke-width="2.5"/></g>`,80); }

/* path on a grid: moves like ['F2','R','F3','L','F1'] starting facing up */
function pathPic(moves, startR, startC, rows, cols, endEm){
  const cs=40; let r=startR, c=startC, d=0; const D=[[-1,0],[0,1],[1,0],[0,-1]]; const pts=[[c,r]]; const turns=[];
  moves.forEach(m=>{ if(m=='R'){ d=(d+1)%4; turns.push([c,r,'R']); } else if(m=='L'){ d=(d+3)%4; turns.push([c,r,'L']); } else { const n=+m.slice(1); r+=D[d][0]*n; c+=D[d][1]*n; pts.push([c,r]); } });
  let s=''; for(let i=0;i<rows;i++) for(let j=0;j<cols;j++) s+=`<rect x="${j*cs+2}" y="${i*cs+2}" width="${cs}" height="${cs}" fill="#f0fdf4" stroke="#cbd5e1"/>`;
  s+=`<polyline points="${pts.map(([x,y])=>`${x*cs+2+cs/2},${y*cs+2+cs/2}`).join(' ')}" fill="none" stroke="#94a3b8" stroke-width="14" stroke-linejoin="round" stroke-linecap="round"/>`;
  s+=`<text x="${startC*cs+2+cs/2}" y="${startR*cs+2+cs/2+10}" font-size="26" text-anchor="middle">🐢</text>`;
  const [ex,ey]=pts[pts.length-1]; s+=`<text x="${ex*cs+2+cs/2}" y="${ey*cs+2+cs/2+10}" font-size="26" text-anchor="middle">${endEm||'🏠'}</text>`;
  return {svg:S(cols*cs+4,rows*cs+4,s,cols*cs*1.1), cw:turns.filter(t=>t[2]=='R').length, acw:turns.filter(t=>t[2]=='L').length};
}
function clockMin(n){ return clock(12,0,{noHands:true}).replace('</svg>',`<line x1="80" y1="80" x2="${80+56*Math.sin(n*Math.PI/6)}" y2="${80-56*Math.cos(n*Math.PI/6)}" stroke="${C.blue}" stroke-width="5" stroke-linecap="round"/><circle cx="80" cy="80" r="5" fill="${C.ink}"/></svg>`); }

function lookup(w){
  w=w.toLowerCase().replace(/[’']s?$/,'').replace(/^-+|-+$/g,'');
  if(IRREG[w] && DICT[IRREG[w]]) return [IRREG[w],DICT[IRREG[w]]];

  const tries=[w.replace(/ies$/,'y'), w.replace(/es$/,''), w.replace(/s$/,''), w.replace(/ing$/,''), w.replace(/ing$/,'e'), w.replace(/ed$/,''), w.replace(/ed$/,'e'), w.replace(/d$/,''), w.replace(/([a-z])\1ing$/,'$1'), w.replace(/([a-z])\1ed$/,'$1')];

}

let voices=[];

function scoreVoice(v){ let s=0; if(/en-GB/i.test(v.lang)) s+=3; if(/en-(US|AU|IE)/i.test(v.lang)) s+=1; if(/natural|premium|enhanced|neural|online/i.test(v.name)) s+=5; if(/google/i.test(v.name)) s+=2; if(/samantha|daniel|serena|kate|libby|sonia|ryan/i.test(v.name)) s+=2; return s; }
function pickVoice(){ if(settings.voice){ const v=voices.find(x=>x.name==settings.voice); if(v) return v; } return voices.slice().sort((a,b)=>scoreVoice(b)-scoreVoice(a))[0]; }
function speak(text, rate, lang){
  if(!window.speechSynthesis){ toast('Trình duyệt này không hỗ trợ đọc. Hãy dùng Chrome/Safari/Edge.'); return; }
  speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(text);
  if(lang==='vi'){ u.lang='vi-VN'; const vv=speechSynthesis.getVoices().find(v=>/^vi/i.test(v.lang)); if(vv) u.voice=vv; }
  else { const v=pickVoice(); if(v){ u.voice=v; u.lang=v.lang; } else u.lang='en-GB'; }
  u.rate=rate||settings.rate; speechSynthesis.speak(u);
}
const FR={'1/2':'one half','1/4':'one quarter','3/4':'three quarters','2/4':'two quarters','1/3':'one third','2/8':'two eighths'};
function sayText(html){
  let t=String(html).replace(/<svg[\s\S]*?<\/svg>/g,' ').replace(/<span class="frac"><sup>(\d+)<\/sup><sub>(\d+)<\/sub><\/span>/g,(m,a,b)=>' '+(FR[a+'/'+b]||a+' over '+b)+' ');
  t=t.replace(/\[\[.*?\]\]/g,' blank ').replace(/<br\s*\/?>/g,'. ').replace(/<[^>]+>/g,' ').replace(/&nbsp;/g,' ');
  t=t.replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE0F}\u{200D}]/gu,' ');
  t=t.replace(/×/g,' times ').replace(/÷/g,' divided by ').replace(/−/g,' minus ').replace(/(\d)\s*-\s*(\d)/g,'$1 minus $2').replace(/\+/g,' plus ').replace(/=/g,' equals ').replace(/☐/g,' box ').replace(/≈/g,' is about ').replace(/°C/g,' degrees Celsius').replace(/\$(\d+)/g,'$1 dollars').replace(/(\d+)c\b/g,'$1 cents').replace(/→/g,', so ').replace(/…/g,' blank ').replace(/\b(\d+)\s?cm\b/g,'$1 centimetres').replace(/\b(\d+)\s?ml\b/g,'$1 millilitres').replace(/\b(\d+)\s?kg\b/g,'$1 kilograms');
  t=t.replace(/(\d{1,2}):(\d{2})/g,(m,h,mm)=> mm=='00'? h+" o'clock" : h+' '+(mm[0]=='0'?'oh '+mm[1]:mm));
  t=t.replace(/\$\s*blank/g,'blank dollars').replace(/blank\s*c\b/g,'blank cents');
  return t.replace(/\s+/g,' ').trim();
}

  const nodes=[]; while(walker.nextNode()) nodes.push(walker.currentNode);
  nodes.forEach(n=>{ const frag=document.createDocumentFragment(); n.nodeValue.split(/([\p{L}][\p{L}'’-]*[\p{L}]|[\p{L}])/u).forEach((part,i)=>{ if(i%2 && /^[A-Za-z'’-]+$/.test(part)){ const s=document.createElement('span'); s.className='w'; s.textContent=part; frag.appendChild(s); } else if(part) frag.appendChild(document.createTextNode(part)); }); n.parentNode.replaceChild(frag,n); });
}

/* ---------- Quiz ---------- */
let quiz=null;
function buildQuestions(id){
  if(id.startsWith('wb-')){ const [,sid,lv]=id.split('-'); const f=findSub(sid); const w=WB[sid]; if(!f||!w) return null; const lvs=lv=='A'?['F','P','C']:[lv];
    return {title:`📒 ${sid} ${lv=='A'?'Workbook (cả 3 mức)':LV[lv][0]}`, back:`wb/${sid}`, unit:f.u, items:lvs.flatMap(L=>(w[L]||[]).map(g=>Object.assign(g(),{sid:sid,lv:L})))}; }
  if(id=='mix'){ const all=[]; UNITS.forEach(u=>u.subs.forEach(s=>s.gens.forEach(g=>all.push([g,u,s.id])))); return {title:'Đề tổng hợp', titleEn:'Mixed review', back:'', items:sample(all,20).map(([g,u,sid])=>Object.assign(g(),{unit:u.n,sid}))}; }
  if(id.startsWith('cp')){ const u=UNITS.find(x=>x.n==+id.slice(2)); const extra=u.subs.map(s=>[pick(s.gens),s.id]); return {title:`Unit ${u.n} – Check your progress`, back:`unit/${u.n}`, unit:u, items:shuffle([...u.check.map(g=>Object.assign(g(),{sid:'cp'})),...extra.map(([g,sid])=>Object.assign(g(),{sid}))])}; }
  if(id.startsWith('all')){ const u=UNITS.find(x=>x.n==+id.slice(3)); const all=[]; u.subs.forEach(s=>s.gens.forEach(g=>all.push([g,s.id]))); u.check.forEach(g=>all.push([g,'cp'])); return {title:`Unit ${u.n} – Ôn cả unit`, back:`unit/${u.n}`, unit:u, items:sample(all,Math.min(12,all.length)).map(([g,sid])=>Object.assign(g(),{sid}))}; }
  const f=findSub(id); if(!f) return null; return {title:`${f.s.id} ${f.s.title}`, back:`unit/${f.u.n}`, unit:f.u, items:shuffle(f.s.gens).map(g=>Object.assign(g(),{sid:id}))};
}
function prepQ(q){
  q.type=q.type||'input';
  if(q.type=='mc'){ let opts=q.opts.map(o=>typeof o=='string'?{h:o,v:o}:o); let ci=0; if(q.ansText!==undefined) ci=opts.findIndex(o=>o.v===q.ansText); else if(q.ansVal!==undefined) ci=opts.findIndex(o=>o.v===q.ansVal); else if(typeof q.ans=='number') ci=q.ans; opts.forEach((o,i)=>o.ok=i==ci); const kept=[]; opts.forEach(o=>{ const d=kept.find(p=>p.v===o.v); if(d){ if(o.ok) d.ok=true; } else kept.push(o); }); opts=kept; q.O=q.keep?opts:shuffle(opts); }
  if(q.type=='multi'){ const opts=q.opts.map((o,i)=>Object.assign(typeof o=='string'?{h:o,v:o}:Object.assign({},o),{ok:q.ans.includes(i)})); q.O=q.keepOrder?opts:shuffle(opts); }
  if(q.type=='order'){ q.O=shuffle(q.items.map((t,i)=>({h:t,i}))); if(q.O.every((o,i)=>o.i==i)) q.O.reverse(); }
  if(q.type=='input'){ q.B=[]; q.html=q.q.replace(/\[\[(.*?)\]\]/g,(m,a)=>{ const alts=a.split('|'); const k=q.B.length; q.B.push(alts); const num=alts.every(x=>/^-?\d+$/.test(x)); const w=Math.max(...alts.map(x=>x.length)); return `<input class="blank ${num?'num':'txt'}" data-k="${k}" ${num?'inputmode="numeric" pattern="[0-9]*"':'autocapitalize="off" autocomplete="off" spellcheck="false"'} style="width:${Math.max(2.2,Math.min(w,14)*0.75+1.4)}em" aria-label="blank ${k+1}">`; }); }
  return q;
}
function startQuiz(id){
  const b=buildQuestions(id); if(!b) return showHome();
  quiz={id, title:b.title, back:b.back, unit:b.unit, qs:b.items.map(prepQ), i:0, res:[]};
  renderQ();
}
function renderQ(){
  const q=quiz.qs[quiz.i], n=quiz.qs.length, col=(quiz.unit&&quiz.unit.color)||'#3a86ff';
  let ans='';
  if(q.type=='mc') ans=`<div class="opts ${q.pics?'pics':''} ${q.wide?'wide':''}">${q.O.map((o,k)=>`<button class="opt" data-k="${k}" onclick="selOpt(${k})">${o.h}</button>`).join('')}</div>`;
  if(q.type=='multi') ans=`<div class="note">👉 Chọn TẤT CẢ đáp án đúng (có thể nhiều hơn 1).</div><div class="opts ${q.pics?'pics':''}">${q.O.map((o,k)=>`<button class="opt multi" data-k="${k}" onclick="togOpt(${k})">${o.h}</button>`).join('')}</div>`;
  if(q.type=='order') ans=`<div class="note">👉 Bấm lần lượt theo đúng thứ tự. Bấm vào ô phía trên để bỏ chọn.</div><div class="ordered" id="ordered"></div><div class="opts order">${q.O.map((o,k)=>`<button class="opt" data-k="${k}" onclick="ordPick(${k})">${o.h}</button>`).join('')}</div>`;
  app.innerHTML=header(quiz.title, quiz.back)+`<main class="wrap"><div class="qbar"><div style="width:${quiz.i/n*100}%;background:${col}"></div></div>
   <div class="card q" style="--c:${col}"><div class="qtop"><span class="qn">Question ${quiz.i+1}/${n}</span><span class="sk">${q.skill}</span></div>
   <div class="qtext tt">${q.type=='input'?q.html:q.q}</div>
   ${q.hint?`<div class="hint">Gợi ý từ: <b>${q.hint}</b></div>`:''}
   <div class="tools"><button class="btn sm ghost" onclick="speak(sayText(quiz.qs[quiz.i].q))">🔊 Đọc đề</button><button class="btn sm ghost" onclick="speak(sayText(quiz.qs[quiz.i].q),0.55)">🐢 Đọc chậm</button><button class="btn sm ghost" onclick="$('#qvi').classList.toggle('hide')">🇻🇳 Dịch đề</button></div>
   <div id="qvi" class="vi box ${settings.showVi?'':'hide'}">${q.qVi}</div>
   ${q.pic?`<div class="qpic tt">${q.pic}</div>`:''}
   ${ans}
   <div id="fb"></div>
   <div class="row end"><button class="btn big" id="checkBtn" onclick="checkQ()">Kiểm tra ✔</button></div></div></main>`;
  wordify($('.qtext')); if($('.qpic')) wordify($('.qpic'));
  const first=$('input.blank'); if(first && matchMedia('(pointer:fine)').matches) first.focus();
  $$('input.blank').forEach((el,k,all)=>el.addEventListener('keydown',e=>{ if(e.key=='Enter'){ e.preventDefault(); if(all[k+1]) all[k+1].focus(); else checkQ(); } }));
  if(settings.auto) setTimeout(()=>speak(sayText(q.q)),250);
}
function selOpt(k){ const q=quiz.qs[quiz.i]; if(q.done) return; q.sel=k; $$('.opt').forEach(b=>b.classList.toggle('sel',+b.dataset.k==k)); }
function togOpt(k){ const q=quiz.qs[quiz.i]; if(q.done) return; q.sel=q.sel||[]; const i=q.sel.indexOf(k); if(i>=0) q.sel.splice(i,1); else q.sel.push(k); $$('.opt').forEach(b=>b.classList.toggle('sel',q.sel.includes(+b.dataset.k))); }
function ordPick(k){ const q=quiz.qs[quiz.i]; if(q.done) return; q.sel=q.sel||[]; if(q.sel.includes(k)) return; q.sel.push(k); drawOrd(); }
function ordUn(j){ const q=quiz.qs[quiz.i]; if(q.done) return; q.sel.splice(j,1); drawOrd(); }
function drawOrd(){ const q=quiz.qs[quiz.i]; $('#ordered').innerHTML=q.sel.map((k,j)=>`<button class="ochip" onclick="ordUn(${j})">${q.O[k].h}</button>`).join(q.sel.length?'<span class="lt">→</span>':''); $$('.opts.order .opt').forEach(b=>b.classList.toggle('used',q.sel.includes(+b.dataset.k))); }
const norm=s=>String(s).toLowerCase().replace(/[−–—]/g,'-').replace(/×/g,'x').replace(/\s*-\s*/g,'-').replace(/\s+/g,' ').replace(/[.!]$/,'').trim();
function sameAns(u,a){ if(/^-?\d+$/.test(a) && /^\s*-?\d+\s*$/.test(u)) return +u==+a; return norm(u)==norm(a) || norm(u).replace(/-/g,' ')==norm(a).replace(/-/g,' '); }
function diagnose(u,a){
  u=String(u).trim(); if(u==='') return 'Con chưa điền ô này.';
  if(!/^\d+$/.test(u)||!/^\d+$/.test(a)) return '';
  const x=+u, y=+a, d=x-y;
  if(u.length==2 && a.length==2 && u==a.split('').reverse().join('')) return 'Con viết ngược chữ số hàng chục và hàng đơn vị.';
  if(Math.abs(d)==10||Math.abs(d)==20) return `Lệch ${Math.abs(d)}: con kiểm tra lại hàng chục.`;
  if(Math.abs(d)==1) return 'Lệch 1: con đếm lại thật cẩn thận.';
  if(Math.abs(d)<=3) return `Lệch ${Math.abs(d)}: gần đúng rồi, con tính lại nhé.`;
  return '';
}
function checkQ(){
  const q=quiz.qs[quiz.i]; if(q.done){ return nextQ(); }
  let ok=false, given='', right='', notes=[];
  if(q.type=='input'){
    const ins=$$('input.blank'); const vals=ins.map(x=>x.value); if(vals.every(v=>v.trim()==='')){ toast('Con hãy điền đáp án trước nhé!'); return; }
    let res=vals.map((v,k)=>q.B[k].some(a=>sameAns(v,a)));
    (q.anyOrder||[]).forEach(g=>{ if(g.length==2){ const [a,b]=g; if(!res[a]||!res[b]){ if(q.B[a].some(x=>sameAns(vals[b],x)) && q.B[b].some(x=>sameAns(vals[a],x))){ res[a]=res[b]=true; } } } });
    ins.forEach((el,k)=>{ el.classList.add(res[k]?'right':'wrong'); el.readOnly=true; if(!res[k]){ const t=document.createElement('span'); t.className='corr'; t.textContent=q.B[k][0]; el.after(t); const dg=diagnose(vals[k],q.B[k][0]); if(dg) notes.push(dg); } });
    ok=res.every(Boolean); given=vals.map(v=>v||'∅').join(' ; '); right=q.B.map(b=>b[0]).join(' ; ');
  }
  if(q.type=='mc'){ if(q.sel===undefined){ toast('Con hãy chọn một đáp án!'); return; } ok=q.O[q.sel].ok; $$('.opt').forEach(b=>{ const o=q.O[+b.dataset.k]; if(o.ok) b.classList.add('right'); else if(+b.dataset.k==q.sel) b.classList.add('wrong'); }); given=q.O[q.sel].h; right=q.O.find(o=>o.ok).h; }
  if(q.type=='multi'){ if(!q.sel||!q.sel.length){ toast('Con hãy chọn đáp án!'); return; } ok=q.O.every((o,k)=>o.ok==q.sel.includes(k)); const miss=q.O.filter((o,k)=>o.ok&&!q.sel.includes(k)).length, extra=q.O.filter((o,k)=>!o.ok&&q.sel.includes(k)).length;
    $$('.opt').forEach(b=>{ const k=+b.dataset.k, o=q.O[k]; if(o.ok) b.classList.add(q.sel.includes(k)?'right':'missed'); else if(q.sel.includes(k)) b.classList.add('wrong'); });
    if(miss) notes.push(`Con còn thiếu ${miss} đáp án đúng (viền xanh nét đứt).`); if(extra) notes.push(`Con chọn thừa ${extra} đáp án sai (màu đỏ).`);
    given=q.sel.map(k=>q.O[k].h).join(', '); right=q.O.filter(o=>o.ok).map(o=>o.h).join(', '); }
  if(q.type=='order'){ q.sel=q.sel||[]; if(q.sel.length<q.O.length){ toast('Con hãy xếp hết các ô!'); return; } const got=q.sel.map(k=>q.O[k].i); ok=got.every((v,i)=>v==i); given=q.sel.map(k=>q.O[k].h).join(' → '); right=q.items.join(' → '); if(!ok) notes.push('Thứ tự đúng: '+right); }
  q.done=true; q.ok=ok;
  quiz.res[quiz.i]={ok, given, right, notes, q};
  $('#fb').innerHTML=`<div class="fb ${ok?'good':'bad'}"><div class="fbh">${ok?pick(['🎉 Correct! Đúng rồi!','🌟 Well done! Giỏi quá!','✅ Great! Chính xác!']):'❌ Not quite. Chưa đúng rồi.'}</div>
   ${!ok&&q.type!='input'&&q.type!='order'?`<div class="ra">Đáp án đúng: <span class="tt">${right}</span></div>`:''}
   ${notes.length?`<div class="diag">🔎 ${notes.join('<br>🔎 ')}</div>`:''}
   <div class="exp tt">💡 ${q.exp}</div><div class="vi">🇻🇳 ${q.expVi}</div>
   <button class="btn sm ghost" onclick="speak(sayText(quiz.qs[quiz.i].exp))">🔊 Nghe giải thích</button></div>`;
  wordify($('#fb .exp')); if(!ok) wordify($('#fb .ra')||document.createElement('div'));
  const btn=$('#checkBtn'); btn.textContent=quiz.i<quiz.qs.length-1?'Câu tiếp ➜':'Xem kết quả 🏆'; btn.focus();
  if(settings.auto) speak(ok?pick(['Correct!','Well done!','Great job!']):'Not quite. Look at the explanation.',settings.rate);
}
function nextQ(){ if(quiz.i<quiz.qs.length-1){ quiz.i++; renderQ(); window.scrollTo(0,0); } else { finishQuiz(); } }
const ADVICE={'Bảng 100 ô':'Ôn lại bảng 100 ô: sang phải +1, sang trái −1, xuống dưới +10, lên trên −10.','Chục và đơn vị':'Dùng que tính: 1 thanh = 1 chục, 1 khối nhỏ = 1 đơn vị. Đọc số chục trước, đơn vị sau.','Giá trị chữ số':'Chữ số bên trái là hàng chục (nhân 10), bên phải là hàng đơn vị.','Đếm thêm, đếm lùi':'Tập đếm thêm/lùi 1 và 10 trên bảng 100 ô.','Số chẵn, số lẻ':'Số chẵn tận cùng 0, 2, 4, 6, 8; số lẻ tận cùng 1, 3, 5, 7, 9.','So sánh số':'So sánh hàng chục trước; nếu bằng nhau mới so sánh hàng đơn vị.','Sắp xếp số':'Sắp xếp: so sánh hàng chục trước rồi đến hàng đơn vị.','Số thứ tự':'Ôn 1st first, 2nd second, 3rd third, 4th fourth…','Toán có lời văn':'Đọc kỹ đề, gạch chân từ khoá: altogether/total → cộng; left/fewer → trừ; each/groups → nhân/chia.','Đổi tiền':'Ôn giá trị: penny 1c, nickel 5c, dime 10c, quarter 25c, half dollar 50c; $1 = 100c.','Xem giờ':'Kim dài chỉ phút, kim ngắn chỉ giờ; mỗi số là 5 phút.','Past và To':'quarter past = 15 phút; half past = 30; quarter to = kém 15 (45 phút).','Đọc đồng hồ kim':'Đếm thêm 5 theo các số trên mặt đồng hồ để đọc phút.','Làm tròn':'Số tận cùng 0–4 làm tròn xuống, 5–9 làm tròn lên.','Trục đối xứng':'Gấp đôi hình theo đường thẳng: hai nửa phải trùng khít.','Đo bằng thước':'Đặt đầu vật ở vạch 0. Nếu không bắt đầu từ 0 thì lấy số cuối trừ số đầu.'};
function finishQuiz(){
  const res=quiz.res, c=res.filter(r=>r.ok).length, n=res.length, sc=Math.round(c/n*100)/10;
  const skills={}; res.forEach(r=>{ const s=r.q.skill; skills[s]=skills[s]||[0,0]; skills[s][1]++; if(r.ok) skills[s][0]++; });
  const b=best(); const key=quiz.id.startsWith('cp')?quiz.id:quiz.id; if(!quiz.noSave && !quiz.id.startsWith('all') && quiz.id!='mix'){ if(b[key]===undefined || sc>b[key]) b[key]=sc; LS.set('best',b); }
  const hist=LS.get('hist',[]); if(!quiz.noSave) hist.unshift({id:quiz.id,t:quiz.title,d:new Date().toISOString(),c,n,sk:skills}); LS.set('hist',hist.slice(0,200));
  quiz.final={c,n,sc,skills}; if(location.hash=='#result') showResult(); else { navStack.pop(); location.replace('#result'); } window.scrollTo(0,0);
}
function showResult(){
  const {c,n,sc,skills}=quiz.final; const wrong=quiz.res.filter(r=>!r.ok);
  const msg=sc>=9?'Xuất sắc! Con nắm bài rất chắc. 🏆':sc>=7?'Tốt lắm! Chỉ cần ôn thêm một chút. 👍':sc>=5?'Khá! Con xem lại các câu sai bên dưới nhé. 💪':'Con cần ôn lại bài. Hãy bấm "📖 Học bài" rồi làm lại nhé. 🤗';
  const weak=Object.entries(skills).filter(([s,v])=>v[0]<v[1]).sort((a,b)=>a[1][0]/a[1][1]-b[1][0]/b[1][1]);
  app.innerHTML=header('Kết quả',quiz.back)+`<main class="wrap"><div class="card result"><div class="score">${sc}<small>/10</small></div><div class="bigstars">${stars(sc)}</div><div>Đúng <b>${c}</b>/${n} câu – ${quiz.title}</div><p class="msg">${msg}</p>
   <div class="row center">${wrong.length?`<button class="btn" onclick="retryWrong()">🔁 Làm lại ${wrong.length} câu sai</button>`:''}<button class="btn ghost" onclick="go('quiz/'+quiz.id)">🎲 Làm đề mới</button>${quiz.back?`<button class="btn ghost" onclick="go('${quiz.back}')">📚 Về unit</button>`:''}</div></div>
   <div class="card"><h3>📊 Phân tích theo kỹ năng</h3><table class="tbl skills">${Object.entries(skills).map(([s,v])=>`<tr><td>${s}</td><td><div class="bar"><div style="width:${v[0]/v[1]*100}%;background:${v[0]==v[1]?'#06d6a0':v[0]/v[1]>=.5?'#ffd166':'#ef476f'}"></div></div></td><td>${v[0]}/${v[1]}</td></tr>`).join('')}</table>
   ${weak.length?`<h4>🎯 Cần ôn lại:</h4><ul>${weak.map(([s])=>`<li><b>${s}</b>${ADVICE[s]?': '+ADVICE[s]:''}</li>`).join('')}</ul>`:'<p>✅ Con làm đúng tất cả các kỹ năng!</p>'}</div>
   ${wrong.length?`<div class="card"><h3>🔎 Xem lại câu sai</h3>${wrong.map(r=>`<div class="rev"><div class="rq tt">${r.q.q.replace(/\[\[(.*?)\]\]/g,'<u>&nbsp;?&nbsp;</u>')}</div>${r.q.pic&&r.q.pic.length<9000?`<div class="rpic">${r.q.pic}</div>`:''}<div class="ry">Con trả lời: <span class="badt">${r.given}</span></div><div class="rr">Đáp án đúng: <span class="goodt">${r.right}</span></div>${r.notes.length?`<div class="diag">🔎 ${r.notes.join(' ')}</div>`:''}<div class="exp tt">💡 ${r.q.exp}</div><div class="vi">🇻🇳 ${r.q.expVi}</div></div>`).join('')}</div>`:''}
  </main>`;
  $$('main .tt').forEach(wordify);
  if(settings.auto) speak(sc>=9?'Excellent!':sc>=7?'Well done!':'Good try! Let us look at the mistakes.');
}
function retryWrong(){ const qs=quiz.res.filter(r=>!r.ok).map(r=>{ const q=Object.assign({},r.q); delete q.done; delete q.ok; delete q.sel; return prepQ(q); }); quiz=Object.assign(quiz,{qs,i:0,res:[],title:quiz.title.replace(/ \(làm lại\)$/,'')+' (làm lại)', id:quiz.id}); quiz.noSave=true; renderQ(); }
function wbStars(sid){ const b=best(); const v=['F','P','C'].map(L=>b['wb-'+sid+'-'+L]).filter(x=>x!==undefined); return v.length? `<small>${v.length}/3</small>`:''; }
function showWB(sid){
  const f=findSub(sid), w=WB[sid]; if(!f||!w) return showHome(); const {u,s}=f; const b=best();
  app.innerHTML=header(`Workbook ${sid}`,`unit/${u.n}`)+`<main class="wrap"><section class="uhead" style="--c:${u.color}"><div class="uicon big">📒</div><div><h2 class="tt">${sid} ${s.title}</h2><div class="vi">Workbook 2 · Exercise ${sid} · ${s.vi}</div></div></section>
   <div class="card"><div class="tt">This workbook gives you questions to practise what you have learned in class. Each exercise has three parts.</div><div class="vi">Mỗi bài trong Workbook có 3 mức: <b>Focus</b> (cơ bản), <b>Practice</b> (luyện tập), <b>Challenge</b> (thử thách). Con nên làm lần lượt từ Focus.</div></div>
   ${['F','P','C'].map(L=>{ const k='wb-'+sid+'-'+L, n=(w[L]||[]).length; return `<div class="card lv" style="--c:${LV[L][2]}"><div class="subtop"><div><span class="sid">${LV[L][0]}</span><h3>${LV[L][1]} · ${n} câu</h3><div class="vi">${LV[L][3]}</div></div><div class="best">${b[k]!==undefined?`<b>${b[k]}</b>/10<br>`:''}${stars(b[k])}</div></div><div class="row"><button class="btn" style="background:${LV[L][2]}" onclick="go('quiz/${k}')">✏️ Làm ${LV[L][0]}</button></div></div>`; }).join('')}
   <div class="row center"><button class="btn ghost" onclick="go('quiz/wb-${sid}-A')">📚 Làm cả 3 mức liền</button><button class="btn ghost" onclick="go('learn/${sid}')">📖 Xem lại bài học</button></div></main>`;
  wordify($('main'));
}
function showWBHome(){
  const b=best();
  app.innerHTML=header('Workbook 2','')+`<main class="wrap"><section class="hero wbh"><div><h1>📒 Cambridge Primary Mathematics Workbook 2</h1><p>Bài tập theo từng unit, mỗi bài có 3 mức: Focus – Practice – Challenge.</p></div></section>
  ${UNITS.map(u=>`<div class="card" style="--c:${u.color}"><h3>${u.icon} Unit ${u.n}: <span class="tt">${u.title}</span></h3><div class="vi">${u.vi}</div><div class="wbsubs">${u.subs.map(s=>`<button class="wbsub" onclick="go('wb/${s.id}')"><b>${s.id}</b> <span>${s.title}</span><span class="lvdots">${['F','P','C'].map(L=>{const v=b['wb-'+s.id+'-'+L]; return `<i style="background:${v===undefined?'#e2e8f0':v>=8?'#06d6a0':v>=5?'#ffd166':'#ef476f'}" title="${LV[L][0]}">${L}</i>`;}).join('')}</span></button>`).join('')}</div></div>`).join('')}</main>`;
}
function showReport(){
  const hist=LS.get('hist',[]); const b=best(); const agg={};
  hist.forEach(h=>Object.entries(h.sk).forEach(([s,v])=>{ agg[s]=agg[s]||[0,0]; agg[s][0]+=v[0]; agg[s][1]+=v[1]; }));
  const rows=Object.entries(agg).sort((a,b)=>a[1][0]/a[1][1]-b[1][0]/b[1][1]);
  app.innerHTML=header('Kết quả học tập','')+`<main class="wrap"><div class="card"><h3>📈 Điểm cao nhất từng bài</h3><table class="tbl">${UNITS.map(u=>`<tr><th colspan="2" style="background:${u.color}22">Unit ${u.n}: ${u.title}</th></tr>`+[...u.subs.flatMap(s=>[[s.id+' '+s.title,b[s.id]],...['F','P','C'].map(L=>['📒 WB '+s.id+' '+LV[L][0],b['wb-'+s.id+'-'+L]])]),['Check your progress',b['cp'+u.n]]].map(([t,v])=>`<tr><td>${t}</td><td>${v===undefined?'<span class="muted">chưa làm</span>':`<b>${v}</b>/10 ${stars(v)}`}</td></tr>`).join('')).join('')}</table></div>
  <div class="card"><h3>🧠 Kỹ năng (tổng hợp mọi lần làm)</h3>${rows.length?`<table class="tbl skills">${rows.map(([s,v])=>`<tr><td>${s}</td><td><div class="bar"><div style="width:${v[0]/v[1]*100}%;background:${v[0]/v[1]>=.9?'#06d6a0':v[0]/v[1]>=.6?'#ffd166':'#ef476f'}"></div></div></td><td>${Math.round(v[0]/v[1]*100)}%</td></tr>`).join('')}</table><p class="muted">Kỹ năng ở trên cùng là kỹ năng con hay sai nhất.</p>`:'<p>Chưa có dữ liệu. Hãy làm vài bài nhé!</p>'}</div>
  <div class="card"><h3>🕘 Lịch sử gần đây</h3>${hist.length?`<table class="tbl">${hist.slice(0,30).map(h=>`<tr><td>${new Date(h.d).toLocaleString('vi-VN',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}</td><td>${h.t}</td><td><b>${Math.round(h.c/h.n*100)/10}</b>/10</td></tr>`).join('')}</table>`:'<p>Chưa có.</p>'}
  <div class="row"><button class="btn ghost sm" onclick="if(confirm('Xoá toàn bộ kết quả đã lưu?')){LS.set('hist',[]);LS.set('best',{});showReport();}">🗑️ Xoá kết quả</button></div></div></main>`;
}
function showSettings(){
  loadVoices(); const vs=voices.slice().sort((a,b)=>scoreVoice(b)-scoreVoice(a)); const cur=pickVoice();
  app.innerHTML=header('Cài đặt','')+`<main class="wrap"><div class="card"><h3>🔊 Giọng đọc tiếng Anh</h3>
   ${vs.length?`<select id="vsel">${vs.map(v=>`<option value="${v.name}" ${cur&&cur.name==v.name?'selected':''}>${v.name} (${v.lang})${scoreVoice(v)>=5?' ⭐':''}</option>`).join('')}</select>`:'<p>Không tìm thấy giọng tiếng Anh trên máy này. Trên iPhone/iPad: Cài đặt → Trợ năng → Nội dung được đọc → Giọng nói → English để tải giọng (nên chọn giọng "Nâng cao/Enhanced").</p>'}
   <p class="muted">⭐ = giọng chất lượng cao (Natural/Enhanced/Premium/Google). Lựa chọn được lưu lại.</p>
   <label>Tốc độ đọc: <b id="rv">${settings.rate}</b></label><input type="range" id="rate" min="0.5" max="1.2" step="0.05" value="${settings.rate}">
   <label class="chk"><input type="checkbox" id="auto" ${settings.auto?'checked':''}> Tự động đọc đề khi mở câu hỏi</label>
   <label class="chk"><input type="checkbox" id="svi" ${settings.showVi?'checked':''}> Luôn hiện bản dịch tiếng Việt của đề bài</label>
   <div class="row"><button class="btn" onclick="speak('Hello! Let us practise maths. What is twenty-five plus ten?')">▶️ Nghe thử</button></div></div>
   <div class="card"><h3>ℹ️ Hướng dẫn</h3><ul><li>Bấm vào <b>bất kỳ từ tiếng Anh</b> nào để xem nghĩa tiếng Việt, hình minh hoạ, nghe phát âm và mở từ điển Cambridge.</li><li>Mỗi bài tập có số ngẫu nhiên – bấm "Làm đề mới" để luyện thêm.</li><li>Kết quả lưu trên trình duyệt của thiết bị này (📈).</li></ul></div></main>`;
  const vsel=$('#vsel'); if(vsel) vsel.onchange=()=>{ settings.voice=vsel.value; saveSettings(); speak('This is my voice.'); };
  $('#rate').oninput=e=>{ settings.rate=+e.target.value; $('#rv').textContent=settings.rate; saveSettings(); };
  $('#auto').onchange=e=>{ settings.auto=e.target.checked; saveSettings(); };
  $('#svi').onchange=e=>{ settings.showVi=e.target.checked; saveSettings(); };
}
document.addEventListener('keydown',e=>{ if(e.key=='Escape') closeWord(); });
route();
</script></body></html>
